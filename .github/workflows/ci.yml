
name: MLflow Project CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas numpy scikit-learn mlserver

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-artifacts
          path: |
            MLProject/mlruns
            MLProject/mlruns/**
            MLProject/mlflow.db

      - name: Find MLflow model path
        id: model_path
        run: |
          MODEL_PATH=$(find MLProject/mlruns -type d -path "*/artifacts/model" | head -n 1)
          echo "model_path=$MODEL_PATH" >> $GITHUB_OUTPUT
          echo "Model path: $MODEL_PATH"
          test -n "$MODEL_PATH"

      - name: Build Docker image with MLflow
        run: |
          mlflow models build-docker -m ${{ steps.model_path.outputs.model_path }} -n ${{ secrets.DOCKER_USERNAME }}/telco-churn-mlflow:latest --enable-mlserver

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/telco-churn-mlflow:latest
